name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin-songs
      - uses: actions/checkout@v7
        with:
          repository: Cuelith/cuelith-sdk
          ref: dev
          path: cuelith-sdk
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: plugin-songs/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: SDK
        working-directory: cuelith-sdk
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Controlli e pacchetto
        working-directory: plugin-songs
        run: |
          pnpm install --frozen-lockfile
          pnpm prettier --check .
          pnpm check
          pnpm build
